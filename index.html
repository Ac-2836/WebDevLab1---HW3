<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resilient Event Hub</title>
  </head>
  <body>
    <h1>Resilient Event Hub</h1>
    <section aria-labelledby="countdown-heading">
      <h2 id="countdown-heading">Countdown</h2>
      <label for="target-date">Event date and time (your local time)</label>
      <input type="datetime-local" id="target-date">
      <output id="countdown" aria-live="polite"></output>
    </section>
    <script type="module" src="main.js"></script>
  </body>
</html>
