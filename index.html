<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resilient Event Hub</title>
  </head>
  <body>
    <h1>Resilient Event Hub</h1>
    <section aria-labelledby="countdown-heading">
      <h2 id="countdown-heading">Countdown</h2>
      <label for="target-date">Event date and time (your local time)</label>
      <input type="datetime-local" id="target-date">
      <output id="countdown" aria-live="polite"></output>
    </section>
    <section aria-labelledby="contact-heading">
      <h2 id="contact-heading">Contact</h2>
      <form id="landing-form">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required minlength="2">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" required maxlength="500" rows="4"></textarea>

        <button type="submit">Send</button>
      </form>
      <p id="form-status" aria-live="polite"></p>
    </section>
    <script type="module" src="main.js"></script>
  </body>
</html>
